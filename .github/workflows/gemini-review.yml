name: Gemini Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "Assets/02.Scripts/**"

concurrency:
  group: gemini-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    # fork PR은 시크릿에 접근할 수 없으므로 제외
    if: github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: google-github-actions/run-gemini-cli@v0
        env:
          GEMINI_CLI_TRUST_WORKSPACE: "true"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_model: gemini-3.5-flash-lite
          github_pr_number: ${{ github.event.pull_request.number }}
          settings: |
            {
              "model": { "maxSessionTurns": 25 },
              "tools": { "core": [] },
              "mcpServers": {
                "github": {
                  "command": "docker",
                  "args": [
                    "run", "-i", "--rm",
                    "-e", "GITHUB_PERSONAL_ACCESS_TOKEN",
                    "ghcr.io/github/github-mcp-server:v0.27.0"
                  ],
                  "includeTools": [
                    "pull_request_read",
                    "get_file_contents",
                    "pull_request_review_write",
                    "add_comment_to_pending_review"
                  ],
                  "env": { "GITHUB_PERSONAL_ACCESS_TOKEN": "${GITHUB_TOKEN}" }
                }
              }
            }
          prompt: |
            너는 Unity C# 프로젝트의 코드 리뷰어다. 코드를 수정하거나 커밋하지 말고 리뷰만 수행한다.
            대상 저장소: ${{ github.repository }}, PR 번호: ${{ github.event.pull_request.number }}

            ## 절차
            1. pull_request_read로 이 PR의 diff와 변경 파일 목록을 조회한다.
            2. Assets/02.Scripts 아래의 변경된 .cs 파일만 검토한다. 다른 파일은 무시한다.
            3. diff만으로 판단하기 어려운 경우에 한해, get_file_contents로 변경된 파일 전체를
               PR head 커밋 기준으로 읽어 주변 맥락(필드 선언, 생명주기 함수, 구독/해제 쌍 등)을 확인한다.
               변경되지 않은 다른 파일이나 저장소 전체를 탐색하지 않는다.
            4. pull_request_review_write(method: create)로 pending 리뷰를 만든다.
            5. 문제가 확인될 때마다 add_comment_to_pending_review로 코멘트를 추가한다.
            6. pull_request_review_write(method: submit_pending, event: COMMENT)로 리뷰를 제출한다.
               본문에는 한국어 전체 요약(검토 파일 수, 심각도별 지적 건수)을 쓴다.
               지적할 문제가 없으면 "확인된 문제 없음"이라고만 요약해 제출한다.

            ## 코멘트 위치 규칙
            - 인라인 코멘트는 PR diff에 포함된 변경 라인(추가/수정된 라인)에만 작성한다.
            - diff 밖의 라인이거나 특정 변경 라인에 붙일 수 없는 문제는 인라인 코멘트로 달지 말고
              최종 리뷰 요약 본문에 위치(파일, 라인)와 함께 포함한다.
            - 각 문제는 중복 없이 한 번만 지적한다. 인라인으로 지적한 문제는 요약에서 반복하지 않고
              건수만 센다.
            - add_comment_to_pending_review 호출이 실패하면 해당 문제를 버리지 말고 최종 요약 본문에
              위치와 함께 기록한다. 제출 전에 시도한 모든 코멘트의 성공/실패를 점검하여 누락이 없게 한다.

            ## 검토 항목
            - 버그 및 논리적 오류
            - null 참조 및 Unity 특유의 null 처리 (UnityEngine.Object의 ==, ?. / ?? 사용 문제 포함)
            - Update/FixedUpdate/LateUpdate의 불필요한 할당과 성능 문제
              (GetComponent·Find·Camera.main 반복 호출, new, LINQ, 문자열 연결, 박싱 등)
            - MonoBehaviour 생명주기 오용과 이벤트 구독·해제 누락 (OnEnable/OnDisable, OnDestroy)
            - 불필요한 연산과 GC Alloc
            - 코드 가독성 및 유지보수성

            ## 지적 기준
            - diff에서 실제로 확인되는 문제만 지적한다.
            - 추측성 문제, 취향 차이, 과도한 마이크로 최적화 제안은 제외한다.
            - 변경되지 않은 코드는 지적하지 않는다.

            ## 코멘트 형식 (모두 한국어)
            - 위치: 파일 경로와 라인
            - 심각도: 높음 / 중간 / 낮음
            - 원인: 왜 문제인지
            - 개선 방법: 구체적인 수정 방향 (필요하면 짧은 코드 예시)
