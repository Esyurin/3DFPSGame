<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',Arial,sans-serif">
  <title>코루틴이 프레임에 걸쳐 나뉘어 실행되는 흐름</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker>
  </defs>
  <rect width="760" height="340" fill="#ffffff"/>
  <text x="380" y="26" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">yield return null 코루틴: 프레임마다 한 구간씩 실행 (메인 스레드)</text>
  <!-- frames -->
  <g font-size="14" font-weight="700" fill="#374151" text-anchor="middle">
    <text x="140" y="62">프레임 N</text><text x="380" y="62">프레임 N+1</text><text x="620" y="62">프레임 N+2</text>
  </g>
  <g fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5">
    <rect x="30" y="72" width="220" height="190" rx="8"/>
    <rect x="270" y="72" width="220" height="190" rx="8"/>
    <rect x="510" y="72" width="220" height="190" rx="8"/>
  </g>
  <!-- Update boxes -->
  <g fill="#e5e7eb" stroke="#6b7280" stroke-width="1.5">
    <rect x="46" y="88" width="188" height="36" rx="6"/>
    <rect x="286" y="88" width="188" height="36" rx="6"/>
    <rect x="526" y="88" width="188" height="36" rx="6"/>
  </g>
  <g font-size="13" fill="#111827" text-anchor="middle">
    <text x="140" y="111">Update 등 일반 로직</text><text x="380" y="111">Update 등 일반 로직</text><text x="620" y="111">Update 등 일반 로직</text>
  </g>
  <!-- coroutine segments -->
  <g fill="#dbeafe" stroke="#1d4ed8" stroke-width="2">
    <rect x="46" y="140" width="188" height="60" rx="6"/>
    <rect x="286" y="140" width="188" height="60" rx="6"/>
    <rect x="526" y="140" width="188" height="60" rx="6"/>
  </g>
  <g font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="middle">
    <text x="140" y="165">코루틴 구간 1</text><text x="380" y="165">코루틴 구간 2</text><text x="620" y="165">코루틴 구간 3</text>
  </g>
  <g font-size="12" font-family="Consolas,monospace" fill="#1e3a8a" text-anchor="middle">
    <text x="140" y="187">→ yield return null</text><text x="380" y="187">→ yield return null</text><text x="620" y="187">→ 메서드 끝(종료)</text>
  </g>
  <!-- other work -->
  <g fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5">
    <rect x="46" y="214" width="188" height="34" rx="6"/>
    <rect x="286" y="214" width="188" height="34" rx="6"/>
    <rect x="526" y="214" width="188" height="34" rx="6"/>
  </g>
  <g font-size="13" fill="#374151" text-anchor="middle">
    <text x="140" y="236">나머지 프레임 처리</text><text x="380" y="236">나머지 프레임 처리</text><text x="620" y="236">나머지 프레임 처리</text>
  </g>
  <!-- resume arrows -->
  <text x="380" y="288" text-anchor="middle" font-size="13" fill="#111827">멈춘 지점에서 Unity가 MoveNext()를 호출해 다음 프레임에 이어서 실행</text>
  <text x="380" y="308" text-anchor="middle" font-size="12" fill="#6b7280">단순화한 모델: 구간 1은 StartCoroutine 호출 시 첫 yield까지 즉시 실행되며,</text>
  <text x="380" y="326" text-anchor="middle" font-size="12" fill="#6b7280">이후 재개 시점은 yield 종류(WaitForSeconds, WaitForEndOfFrame 등)마다 다르다.</text>
  <path d="M250,170 L270,170" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M490,170 L510,170" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#a)"/>
</svg>
